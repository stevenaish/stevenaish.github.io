# Site
url: https://stevenaish.com

# Address used for canonical links, Open Graph tags, and structured data.
# Kept separate from "url" because "jekyll serve" replaces "url" with the
# local preview address, and these tags must always name the real site.
canonical_host: https://stevenaish.com

# X card settings used in the page head.
twitter:
  card: summary_large_image
  username: stevenaish

# Contact form (Build Handoff Part L). The form, its text, and the "Send a message"
# buttons appear only when "enabled" is true. The Worker is deployed on the route
# /api/contact. The Turnstile site key below is public by design. The secret key and
# the destination address are Worker secrets and are never in this repository.
# The local preview uses Cloudflare's published test key and a local test Worker
# through _config.preview.yml instead.
contact:
  enabled: true
  endpoint: /api/contact
  turnstile_sitekey: "0x4AAAAAAFQ6AqI2SogvnN2j"

# The one "Content updated" setting, as year-month (YYYY-MM). Build list item 18
# sets the launch month here. It drives the visible "Content updated" text in the
# footer, on Career History, and in print, and the dateModified value in the
# structured data, so they always match.
content_updated: "2026-10"

# Build settings (no theme: the site has its own layouts and stylesheet)
theme: null

# Files that stay in the repository only and are not published on the site.
# CNAME is listed because GitHub Pages excludes it by default, and that default
# is dropped as soon as this list exists. The CNAME file itself is not changed.
exclude:
  - CNAME
  - LICENSE
  - Gemfile
  - Gemfile.lock

# Keep the old forwarding file out of the sitemap. This only sets a flag for
# the sitemap plugin; the file itself is not edited, wrapped, or processed.
defaults:
  - scope:
      path: "marketplace/index.html"
    values:
      sitemap: false

plugins:
 - jekyll-seo-tag
 - jekyll-sitemap
